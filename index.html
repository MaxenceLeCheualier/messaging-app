<!doctype html>
<html>
  <head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h1 {
            font-size: 16px;
            padding: 10px;
            background: #aa00ff;
            color: white;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        #meta {
            font-size: 12px;
            color: #5b5b5b;
            margin-left: auto;
        }

        #messages {
            list-style-type: none;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 10px;
        } 

        #messages li {
            background: rgba(42, 42, 42, 0.744);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            color: white;
        }

        #input {
            padding: 10px;
            background-color: #5b5b5b;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            color: white;
        }

        #input::placeholder {
            color: white;
       }

        #sendBtn {
            padding: 10px 20px;
            background: #aa00ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Generate a random ID so we can see who "send the message"
        const myId = "User-" + Math.floor(Math.random() * 1000);
        const ws = new WebSocket(`ws://localhost:8000/ws/${myId}`);

        ws.onmessage = (event) => {
          // Parse the JSON string back into a JS Object
          const data = JSON.parse(event.data);

          // Create a new list item for the message incoming from the server
          const li = document.createElement("li")
          li.innerText = `${data.sender} (${data.time}): ${data.text}` // The list item will show the sender, time, and text of the message
          document.getElementById("messages").appendChild(li) // Add the list item to the unordered list with id "messages"

        };

        // Add a function to the toggle button to send a message to the server when clicked
        function send() {
          const input = document.getElementById("input");
          if (!input.value.trim()) return; // Make sure you can't send empty messages (such as in most common messaging platforms)
          ws.send(JSON.stringify({ text: input.value })); // Convert the JS Object into a JSON string and send it to the server
          input.value = ""; // Clear the input field after sending the message
        }
    
    document.getElementById("sendBtn").addEventListener("click", send); 
    document.getElementById("input").addEventListener("keypress", (event) => {
      if (event.key === "Enter") {
        send();
      }
    });
      });
    </script>
  </head>
  <body>
    <h1> Messagerie </h1> 
      <ul id = "messages"></ul>
        <input id="input" type="text" placeholder="Type your message here..." />
        <button id="sendBtn">Send</button>
    </body>
</html>
